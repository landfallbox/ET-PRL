[project]
name = "et-prl"
version = "0.1.0"
description = "Event-driven PRL (LSTM prediction + DQN control + anomaly gate) for chiller supply-temperature control"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.10.0",
    "numpy>=2.4.2",
    "optuna>=4.7.0",
    "pandas>=3.0.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.3.0",
    "tensorboard>=2.16.0",
    "torch>=2.10.0,<2.11",
]

[project.optional-dependencies]
docs = [
    "python-docx>=1.1.0",
]
dev = [
    "black>=24.0.0",
    "pylint>=3.0.0",
]

[project.scripts]
etprl-train-dqn = "et_prl.cli.train:main_dqn"
etprl-test-dqn = "et_prl.cli.evaluate:main_dqn"
etprl-optimize-dqn = "et_prl.cli.optimize:main_dqn"
etprl-train-lstm = "et_prl.cli.train:main_lstm"
etprl-test-lstm = "et_prl.cli.evaluate:main_lstm"
etprl-optimize-lstm = "et_prl.cli.optimize:main_lstm"
etprl-predict-lstm = "et_prl.cli.lstm_predict:main"
etprl-compare-control = "et_prl.cli.control_compare:main"
etprl-test-event-driven = "et_prl.cli.evaluate:main_event_driven"
etprl-prewarm-gate = "et_prl.cli.gate_prewarm:main"
etprl-optimize-gate = "et_prl.cli.optimize:main_gate"
etprl-analyze-gate-sensitivity = "et_prl.cli.optimize:main_gate_sensitivity"
etprl-run-ablation-all = "et_prl.cli.ablation:main_all"
etprl-run-ablation-full = "et_prl.cli.ablation:main_full_et_prl"
etprl-run-ablation-wo-dual-threshold = "et_prl.cli.ablation:main_wo_dual_threshold"
etprl-run-ablation-wo-local-threshold = "et_prl.cli.ablation:main_wo_local_threshold"
etprl-run-ablation-wo-multi-scale = "et_prl.cli.ablation:main_wo_multi_scale"
etprl-run-ablation-single-scale-short = "et_prl.cli.ablation:main_single_scale_short"
etprl-run-ablation-single-scale-medium = "et_prl.cli.ablation:main_single_scale_medium"
etprl-run-ablation-single-scale-long = "et_prl.cli.ablation:main_single_scale_long"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/et_prl"]

[tool.uv]
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"

# Black 代码格式化配置
[tool.black]
line-length = 100
target-version = ["py313"]
include = '\.pyi?$'

