[project]
name = "event-dqn"
version = "0.1.0"
description = "Event-driven DQN control project with LSTM prediction and evaluation workflows"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.10.0",
    "ml-toolkit",
    "numpy>=2.4.2",
    "optuna>=4.7.0",
    "pandas>=3.0.0",
    "pyyaml>=6.0.3",
    "torch>=2.10.0",
]

[project.scripts]
event-dqn-train-dqn = "src.applications.dqn_train:main"
event-dqn-eval-dqn = "src.applications.dqn_eval:main"
event-dqn-optimize-dqn = "src.applications.dqn_optimize:main"
event-dqn-preprocess-dqn = "src.applications.dqn_preprocess:main"
event-dqn-train-lstm = "src.applications.lstm_train:main"
event-dqn-eval-lstm = "src.applications.lstm_eval:main"
event-dqn-optimize-lstm = "src.applications.lstm_optimize:main"
event-dqn-preprocess-lstm = "src.applications.lstm_preprocess:main"
event-dqn-predict-lstm = "src.applications.lstm_predict:main"
event-dqn-eval-lstm-prediction = "src.applications.lstm_prediction_eval:main"
event-dqn-compare-control = "src.applications.compare_control:main"
event-dqn-eval-event-driven = "src.applications.event_driven_eval:main"
event-dqn-prewarm-gate = "src.applications.gate_prewarm:main"
event-dqn-generate-labels = "src.applications.generate_labels:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src", "config"]

[tool.uv.sources]
ml-toolkit = { git = "https://github.com/landfallbox/ml-toolkit.git" }

