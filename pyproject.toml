[project]
name = "event-dqn"
version = "0.1.0"
description = "Event-driven DQN control project with LSTM prediction and evaluation workflows"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.10.0",
    "ml-toolkit",
    "numpy>=2.4.2",
    "optuna>=4.7.0",
    "pandas>=3.0.0",
    "pyyaml>=6.0.3",
    "torch>=2.10.0,<2.11",
]

[project.optional-dependencies]
docs = [
    "python-docx>=1.1.0",
]

[project.scripts]
event-dqn-train-dqn = "src.cli.train:main_dqn"
event-dqn-test-dqn = "src.cli.test:main_dqn"
event-dqn-optimize-dqn = "src.cli.optimize:main_dqn"
event-dqn-train-lstm = "src.cli.train:main_lstm"
event-dqn-test-lstm = "src.cli.test:main_lstm"
event-dqn-optimize-lstm = "src.cli.optimize:main_lstm"
event-dqn-predict-lstm = "src.cli.lstm_predict:main"
event-dqn-compare-control = "src.cli.control_compare:main"
event-dqn-test-event-driven = "src.cli.test:main_event_driven"
event-dqn-prewarm-gate = "src.cli.gate_prewarm:main"
event-dqn-optimize-gate = "src.cli.optimize:main_gate"
event-dqn-analyze-gate-sensitivity = "src.cli.optimize:main_gate_sensitivity"
event-dqn-run-ablation-all = "src.cli.ablation:main_all"
event-dqn-run-ablation-single-scale-short = "src.cli.ablation:main_single_scale_short"
event-dqn-run-ablation-single-scale-medium = "src.cli.ablation:main_single_scale_medium"
event-dqn-run-ablation-single-scale-long = "src.cli.ablation:main_single_scale_long"
event-dqn-run-ablation-wo-local-threshold = "src.cli.ablation:main_wo_local_threshold"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src", "config"]

[tool.uv]
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"

[tool.uv.sources]
ml-toolkit = { git = "https://github.com/landfallbox/ml-toolkit.git" }

