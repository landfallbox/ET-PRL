# pre-commit 钩子配置：git commit 时自动执行静态检查
# 安装：uv run pre-commit install
# 手动全量跑：uv run pre-commit run --all-files
# 说明：全部走 `uv run`，与项目 uv 工作流保持一致，不依赖全局工具
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (lint，可自动修复项直接修复)
        entry: uv run ruff check --fix
        language: system
        types: [python]

      - id: ruff-format
        name: ruff format (格式化)
        entry: uv run ruff format
        language: system
        types: [python]

      - id: pyright
        name: pyright (类型检查，basic 档)
        entry: uv run pyright
        language: system
        pass_filenames: false
        files: ^src/
