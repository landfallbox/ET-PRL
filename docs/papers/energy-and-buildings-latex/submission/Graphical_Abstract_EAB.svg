<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="13cm" height="5.2cm" viewBox="0 0 2500 1000" role="img" aria-labelledby="title desc">
  <title id="title">Event-Triggered Predictive Reinforcement Learning with Unsupervised Dynamic Event Gating for Energy Efficient HVAC Control</title>
  <desc id="desc">Fixed-interval and static-threshold HVAC control are replaced by predictive reinforcement learning with unsupervised dynamic event gating, reducing action updates and energy use.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#263238"/>
    </marker>
    <marker id="arrow-light" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#ffffff"/>
    </marker>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="135%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#263238" flood-opacity="0.14"/>
    </filter>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 37px; font-weight: 700; fill: #173f46; }
      .section { font-family: Arial, sans-serif; font-size: 34px; font-weight: 700; fill: #263238; }
      .label { font-family: Arial, sans-serif; font-size: 26px; font-weight: 700; fill: #263238; }
      .body { font-family: Arial, sans-serif; font-size: 25px; fill: #455a64; }
      .small { font-family: Arial, sans-serif; font-size: 22px; fill: #455a64; }
      .problem { font-family: Arial, sans-serif; font-size: 27px; font-weight: 700; fill: #a74c48; }
      .gate-title { font-family: Arial, sans-serif; font-size: 28px; font-weight: 700; fill: #00695c; }
      .gate-label { font-family: Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #263238; }
      .gate-small { font-family: Arial, sans-serif; font-size: 18px; fill: #455a64; }
      .gate-decision { font-family: Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #ffffff; }
      .gate-step { font-family: Arial, sans-serif; font-size: 17px; font-weight: 700; fill: #00796b; }
      .white { fill: #ffffff; }
      .metric { font-family: Arial, sans-serif; font-size: 62px; font-weight: 700; fill: #ffffff; }
      .metric-label { font-family: Arial, sans-serif; font-size: 23px; font-weight: 700; fill: #ffffff; }
    </style>
  </defs>

  <rect width="2500" height="1000" fill="#f7faf9"/>
  <rect x="0" y="0" width="2500" height="104" fill="#ffffff"/>
  <rect x="0" y="100" width="2500" height="4" fill="#e0e8e6"/>
  <text x="82" y="66" class="title">Event-Triggered Predictive Reinforcement Learning with Unsupervised Dynamic Event Gating for Energy Efficient HVAC Control</text>

  <!-- Context -->
  <rect x="60" y="148" width="560" height="776" rx="18" fill="#ffffff" stroke="#d5dfdc" stroke-width="3" filter="url(#shadow)"/>
  <rect x="60" y="148" width="560" height="78" rx="18" fill="#e9f0ee"/>
  <rect x="60" y="208" width="560" height="18" fill="#e9f0ee"/>
  <text x="340" y="199" text-anchor="middle" class="section">Conventional trigger schemes</text>

  <text x="105" y="279" class="label">Fixed-interval control</text>
  <line x1="110" y1="431" x2="568" y2="431" stroke="#78909c" stroke-width="3"/>
  <line x1="110" y1="309" x2="110" y2="431" stroke="#78909c" stroke-width="3"/>
  <path d="M112 403 C170 398, 205 397, 258 390 S348 327, 394 339 S468 378, 566 320" fill="none" stroke="#00796b" stroke-width="10" stroke-linecap="round"/>
  <text x="126" y="332" class="small">Cooling load</text>
  <g stroke="#d64f4f" stroke-width="5">
    <line x1="140" y1="431" x2="140" y2="458"/><line x1="180" y1="431" x2="180" y2="458"/>
    <line x1="220" y1="431" x2="220" y2="458"/><line x1="260" y1="431" x2="260" y2="458"/>
    <line x1="300" y1="431" x2="300" y2="458"/><line x1="340" y1="431" x2="340" y2="458"/>
    <line x1="380" y1="431" x2="380" y2="458"/><line x1="420" y1="431" x2="420" y2="458"/>
    <line x1="460" y1="431" x2="460" y2="458"/><line x1="500" y1="431" x2="500" y2="458"/>
    <line x1="540" y1="431" x2="540" y2="458"/>
  </g>
  <rect x="94" y="465" width="492" height="45" rx="10" fill="#f7ecea"/>
  <text x="340" y="496" text-anchor="middle" class="problem">Redundant updates in stable periods</text>

  <line x1="96" y1="527" x2="584" y2="527" stroke="#d5dfdc" stroke-width="3"/>
  <text x="105" y="576" class="label">Static-threshold control</text>
  <line x1="110" y1="761" x2="568" y2="761" stroke="#78909c" stroke-width="3"/>
  <line x1="110" y1="608" x2="110" y2="761" stroke="#78909c" stroke-width="3"/>
  <path d="M112 730 C170 720, 210 705, 258 714 S340 635, 392 648 S472 716, 566 624" fill="none" stroke="#00796b" stroke-width="10" stroke-linecap="round"/>
  <line x1="112" y1="674" x2="566" y2="674" stroke="#d64f4f" stroke-width="7" stroke-dasharray="18 13"/>
  <text x="126" y="638" class="small">Preset threshold</text>
  <circle cx="326" cy="670" r="11" fill="#d64f4f"/>
  <circle cx="520" cy="665" r="11" fill="#d64f4f"/>
  <rect x="94" y="785" width="492" height="45" rx="10" fill="#f7ecea"/>
  <text x="340" y="816" text-anchor="middle" class="problem">Missed or excessive triggers under drift</text>
  <rect x="102" y="847" width="476" height="52" rx="12" fill="#fff1d6" stroke="#e9a825" stroke-width="3"/>
  <text x="340" y="882" text-anchor="middle" class="section">Limited adaptability</text>

  <!-- Main flow -->
  <path d="M640 536 L700 536" stroke="#263238" stroke-width="6" marker-end="url(#arrow)"/>
  <rect x="700" y="148" width="1160" height="776" rx="18" fill="#ffffff" stroke="#b8cfca" stroke-width="3" filter="url(#shadow)"/>
  <rect x="700" y="148" width="1160" height="78" rx="18" fill="#dcedea"/>
  <rect x="700" y="208" width="1160" height="18" fill="#dcedea"/>
  <text x="1280" y="199" text-anchor="middle" class="section">Predict, detect, and act only when needed</text>

  <!-- unified dynamic gate -->
  <rect x="790" y="258" width="970" height="280" rx="16" fill="#fffaf0" stroke="#d08b14" stroke-width="4"/>
  <text x="1275" y="301" text-anchor="middle" class="gate-title">Unsupervised dynamic event gate</text>

  <!-- predictive state input -->
  <rect x="815" y="326" width="190" height="160" rx="12" fill="#edf6f4" stroke="#6b9f95" stroke-width="3"/>
  <text x="910" y="355" text-anchor="middle" class="gate-step">INPUT</text>
  <text x="910" y="385" text-anchor="middle" class="gate-label">Predictive state s<tspan baseline-shift="sub" font-size="14">t</tspan></text>
  <text x="910" y="417" text-anchor="middle" class="gate-small">Load · weather</text>
  <text x="910" y="440" text-anchor="middle" class="gate-small">· forecast ·</text>
  <rect x="846" y="452" width="128" height="24" rx="12" fill="#dcedea"/>
  <text x="910" y="470" text-anchor="middle" class="gate-small">shared state</text>

  <path d="M1015 406 L1035 406" stroke="#263238" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- multi-scale scoring -->
  <rect x="1045" y="326" width="210" height="160" rx="12" fill="#ffffff" stroke="#7bb5aa" stroke-width="3"/>
  <text x="1150" y="355" text-anchor="middle" class="gate-step">1 · SCORE</text>
  <text x="1150" y="383" text-anchor="middle" class="gate-label">Multi-scale scoring</text>
  <line x1="1080" y1="414" x2="1155" y2="414" stroke="#009688" stroke-width="7" stroke-linecap="round"/>
  <line x1="1080" y1="435" x2="1190" y2="435" stroke="#4db6ac" stroke-width="7" stroke-linecap="round"/>
  <line x1="1080" y1="456" x2="1220" y2="456" stroke="#80cbc4" stroke-width="7" stroke-linecap="round"/>
  <text x="1070" y="419" text-anchor="end" class="gate-small">S</text>
  <text x="1070" y="440" text-anchor="end" class="gate-small">M</text>
  <text x="1070" y="461" text-anchor="end" class="gate-small">L</text>
  <text x="1150" y="480" text-anchor="middle" class="gate-small">Fused score A(s<tspan baseline-shift="sub" font-size="13">t</tspan>)</text>

  <path d="M1265 406 L1280 406" stroke="#263238" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- adaptive thresholds -->
  <rect x="1290" y="326" width="220" height="160" rx="12" fill="#ffffff" stroke="#e4b45c" stroke-width="3"/>
  <text x="1400" y="355" text-anchor="middle" class="gate-step">2 · ADAPT</text>
  <text x="1400" y="383" text-anchor="middle" class="gate-label">Adaptive thresholds</text>
  <path d="M1320 438 C1352 420, 1382 431, 1410 407 S1460 396, 1482 385" fill="none" stroke="#d64f4f" stroke-width="6" stroke-linecap="round"/>
  <path d="M1320 450 C1362 446, 1406 442, 1482 421" fill="none" stroke="#d08b14" stroke-width="6" stroke-dasharray="13 9"/>
  <text x="1358" y="414" class="gate-small">local</text>
  <text x="1438" y="454" class="gate-small">global</text>
  <text x="1400" y="480" text-anchor="middle" class="gate-small">Dynamic threshold τ<tspan baseline-shift="sub" font-size="13">t</tspan></text>

  <path d="M1520 406 L1535 406" stroke="#263238" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- trigger decision -->
  <rect x="1545" y="326" width="190" height="160" rx="12" fill="#ffffff" stroke="#7bb5aa" stroke-width="3"/>
  <text x="1640" y="355" text-anchor="middle" class="gate-step">3 · DECIDE</text>
  <text x="1640" y="383" text-anchor="middle" class="gate-label">Trigger decision</text>
  <text x="1640" y="418" text-anchor="middle" class="gate-label">A(s<tspan baseline-shift="sub" font-size="14">t</tspan>) &gt; τ<tspan baseline-shift="sub" font-size="14">t</tspan></text>
  <rect x="1564" y="438" width="83" height="32" rx="16" fill="#d64f4f"/>
  <text x="1606" y="460" text-anchor="middle" class="gate-decision">EVENT</text>
  <rect x="1655" y="438" width="62" height="32" rx="16" fill="#e9efed" stroke="#78909c" stroke-width="2"/>
  <text x="1686" y="460" text-anchor="middle" class="gate-step">HOLD</text>

  <!-- compact action selection -->
  <path d="M1640 496 L1640 558 L1280 558 L1280 584" fill="none" stroke="#263238" stroke-width="6" marker-end="url(#arrow)"/>
  <rect x="808" y="592" width="944" height="254" rx="18" fill="#f8fbfa" stroke="#b8cfca" stroke-width="4"/>
  <text x="1280" y="638" text-anchor="middle" class="label">On-demand action selection</text>
  <rect x="850" y="670" width="402" height="126" rx="14" fill="#00796b"/>
  <text x="1051" y="708" text-anchor="middle" class="small white">EVENT DETECTED</text>
  <text x="1051" y="749" text-anchor="middle" class="label white">Predictive DQN</text>
  <text x="1051" y="780" text-anchor="middle" class="small white">Update HVAC setpoint</text>
  <rect x="1308" y="670" width="402" height="126" rx="14" fill="#e9efed" stroke="#78909c" stroke-width="3"/>
  <text x="1509" y="708" text-anchor="middle" class="small">NO EVENT</text>
  <text x="1509" y="749" text-anchor="middle" class="label">Hold setpoint</text>
  <text x="1509" y="780" text-anchor="middle" class="small">Zero-order hold</text>
  <text x="1280" y="888" text-anchor="middle" class="small">Responsive under disturbances · sparse during stable operation</text>

  <!-- Outcomes -->
  <path d="M1880 536 L1940 536" stroke="#263238" stroke-width="6" marker-end="url(#arrow)"/>
  <rect x="1940" y="148" width="500" height="776" rx="18" fill="#173f46" filter="url(#shadow)"/>
  <text x="2190" y="207" text-anchor="middle" class="section white">Validated on real chiller data</text>

  <rect x="1992" y="296" width="396" height="224" rx="14" fill="#00796b"/>
  <text x="2190" y="393" text-anchor="middle" class="metric">53.54%</text>
  <text x="2190" y="451" text-anchor="middle" class="metric-label">fewer action updates</text>

  <rect x="1992" y="566" width="396" height="224" rx="14" fill="#d08b14"/>
  <text x="2190" y="663" text-anchor="middle" class="metric">2.13%</text>
  <text x="2190" y="721" text-anchor="middle" class="metric-label">less energy use</text>

  <text x="2190" y="862" text-anchor="middle" class="small white">Compared with fixed-step RL</text>
</svg>